services:
  laya:
    build:
      context: ./laya
      args:
        TORCH_VERSION: "${LAYA_TORCH_VERSION:-2.14.0}"
    environment:
      LAYA_HOST: "0.0.0.0"
      LAYA_PORT: "${LAYA_PORT:-8000}"
      LAYA_DEVICE: "cpu"
      LAYA_PRELOAD: "1"
      LAYA_MODELS: "multilingual"
      LAYA_MAX_LOADED: "1"
      LAYA_THREADS: "${OMP_NUM_THREADS:-4}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
      LAYA_LOG_LEVEL: "info"
      HF_HUB_OFFLINE: "${HF_HUB_OFFLINE:-0}"
    volumes:
      - laya-model-cache:/home/laya/.cache/huggingface
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['LAYA_PORT'] + '/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
      start_interval: 3s

  app:
    build:
      context: ./app
      # Setzen make up und scripts/deploy.sh über scripts/build-info.sh; leer heißt unbekannt.
      args:
        BUILD_NUMBER: "${BUILD_NUMBER:-}"
        BUILD_COMMIT: "${BUILD_COMMIT:-}"
        BUILD_DIRTY: "${BUILD_DIRTY:-}"
        BUILD_TIME: "${BUILD_TIME:-}"
    environment:
      LAYA_URL: "http://laya:${LAYA_PORT:-8000}"
      GATE_THRESHOLD: "${GATE_THRESHOLD:-0.5}"
      LAYA_REJECT_THRESHOLD: "${LAYA_REJECT_THRESHOLD:-0.9}"
      LAYA_RECAT_THRESHOLD: "${LAYA_RECAT_THRESHOLD:-0.95}"
      GLINER_THRESHOLD: "${GLINER_THRESHOLD:-0.5}"
      MAX_TEXT_CHARS: "${MAX_TEXT_CHARS:-50000}"
      REQUEST_LOG: "${REQUEST_LOG:-/var/log/pii-app/requests.jsonl}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-4}"
      HF_HUB_OFFLINE: "1"
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - ./examples:/opt/examples:ro
      # Request-Log; überdauert Deploys, make down (ohne -v) lässt es stehen.
      - request-log:/var/log/pii-app
    depends_on:
      laya:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m
      start_interval: 2s

volumes:
  laya-model-cache:
  request-log:
