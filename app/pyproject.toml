[project]
name = "fidelius"
version = "0.3.0"
description = "Lokale Anonymisierung von E-Mails vor dem Prompting: GLiNER2-PII + spaCy + Regex, bestätigt durch Laya"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "gliner2[local]==2.0.0",
    "transformers==4.51.3",
    "sentencepiece>=0.2",
    "protobuf>=4",
    "spacy>=3.8,<3.9",
    "google-re2>=1.1",
]

[project.optional-dependencies]
# httpx2 (pydantic/httpx2) ist kein Typosquat von httpx, Starlette 1.7 verlangt es für den TestClient.
# Gepinnt auf 2.10.0, die letzte Version mit PyPI-Provenance: Seit 2.11.0 veröffentlicht httpx2
# per `uv publish` ohne Attestations. Pin erst lösen, wenn neue Versionen wieder Provenance tragen.
dev = ["pytest>=8", "ruff>=0.6", "httpx2==2.10.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
